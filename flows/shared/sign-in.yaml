# Cold-start the app and sign in, leaving it on the tab shell.
#
# For flows that are about something behind the session rather than about the
# login itself. Since KMO-8 a cold start lands on `/login` and the tabs do not
# exist until there is a token, so a flow that needs the shell has to get one.
#
# It needs a reachable `ams` with the demo seeders — EXPO_PUBLIC_API_URL pointing
# at it and `employee@example.com` still holding the seeded password. A flow that
# does not need the shell should keep using shared/launch.yaml and stay
# independent of the backend.
#
# Since KMO-9 the token is in the keystore, so a run only reaches the login screen
# because clearState inside launch.yaml wipes it first. A flow that relaunches the
# app without clearing state keeps its session — see kmo-9-secure-token-restore.yaml.
#
# Since KMO-10 the first login on a phone with a fingerprint enrolled raises the
# biometric offer over the shell, and that sheet is a modal — nothing behind it is
# in the hierarchy, so `Inicio` is not merely covered, it is unfindable. Every flow
# using this one would fail on such an AVD, on an assertion that has nothing to do
# with what it was testing. So the offer is declined here. Flows that care about
# the offer start from enter-credentials.yaml and handle it themselves.
appId: cl.kolvi.empleados
---
- runFlow: enter-credentials.yaml

# Optional in both directions: the sheet is absent on an AVD with nothing
# enrolled, and on one with a fingerprint it arrives a beat after the session
# settles. The wait is what makes the check below deterministic rather than a
# race against the sheet's animation.
- extendedWaitUntil:
    visible: 'Ahora no'
    timeout: 10000
    optional: true
    label: 'The biometric offer, if this phone can do it'

- runFlow:
    when:
      visible: 'Ahora no'
    commands:
      - tapOn: 'Ahora no'
    label: 'Decline it, so the shell is what this subflow hands back'

# And the same problem again, from the other side. Since KMO-16 Inicio offers the
# location rationale the first time it finds no permission, and that sheet is a
# `Modal` too — with it up, nothing on the tab behind it is in the hierarchy, so
# a flow asserting `Inicio` or anything on it fails on a sheet it never mentioned.
#
# Dismissed by its own testID rather than by `Ahora no`: the biometric offer above
# uses those same two words, and a text match would make which sheet got tapped
# depend on which one happened to be up.
#
# Matched on the title rather than on the button, because the sheet animates up
# and the wait is what makes this deterministic. Optional in both directions: it
# is absent whenever the permission has already been answered on this AVD.
- extendedWaitUntil:
    visible: 'Kolvi usa tu ubicación al marcar'
    timeout: 10000
    optional: true
    label: 'The location rationale, if this run is the first without a permission'

- runFlow:
    when:
      visible: 'Kolvi usa tu ubicación al marcar'
    commands:
      - tapOn:
          id: 'location-rationale-dismiss'
    label: 'Dismiss it — flows that are about it raise it again themselves'

- extendedWaitUntil:
    visible: 'Inicio'
    timeout: 30000
    label: 'Signed in and on the tab shell'
