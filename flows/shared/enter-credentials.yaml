# Cold-start the app and submit the seeded employee's credentials.
#
# Stops the moment `Ingresar` is tapped and asserts nothing about what comes
# next, which is the whole reason it is separate from sign-in.yaml: since KMO-10
# what comes next depends on the device. A phone with a fingerprint enrolled gets
# the biometric offer over the tab shell, and a phone without one goes straight to
# the tabs.
#
# Most flows want sign-in.yaml, which handles that fork and leaves the app on the
# shell. Start from this one only when the fork itself is what the flow is about —
# flows/kmo-10-biometric-unlock.yaml is the only such flow today.
#
# Needs a reachable `ams` with the demo seeders: EXPO_PUBLIC_API_URL pointing at
# it and `employee@example.com` still holding the seeded password.
appId: cl.kolvi.empleados
---
- runFlow: launch.yaml

- extendedWaitUntil:
    visible: 'Ingresar'
    timeout: 60000
    label: 'The login screen is up'

- tapOn:
    id: 'login-email'
    label: 'The email field'
- inputText: 'employee@example.com'
- tapOn:
    id: 'login-password'
    label: 'The password field'
- inputText: 'admin'

# `hideKeyboard` used to be here and cannot be: it sends a back press, and the
# AVD is created with `hw.keyboard=yes` (bin/emu, so `adb shell input text`
# works). With a hardware keyboard present Android routes back to the activity
# rather than to the IME, so the app closes and every flow that signs in fails at
# the next step against the launcher. Reproducible outside Maestro with a bare
# `adb shell input keyevent 4` on the login screen.
#
# A tap on the empty page tint above the heading dismisses the keyboard the way a
# person would, and is the same idiom launch.yaml already uses to get out from
# under the dev menu. 10% rather than 20%: the greeting block starts lower on
# this screen than the sheet does there.
- tapOn:
    point: '50%,10%'
    label: 'Dismiss the keyboard by tapping the page above the form'

- tapOn: 'Ingresar'
