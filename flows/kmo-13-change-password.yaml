# KMO-13 — Cambiar contraseña is reachable from Mi perfil, and a wrong current
# password comes back under the field it belongs to.
#
# Covers #5 (the screen is reached from Mi perfil), #1 (it collects the current
# password and the new one with a confirmation) and the half of #2 that only a
# real server can prove: the Spanish sentence under `Contraseña actual` is `ams`'s
# own, out of lang/es/validation.php, and it arrived over the wire rather than
# from src/i18n. The catalogue deliberately holds no wording for it.
#
# **It does not complete a successful change, and must not.** A change that
# succeeded would rotate employee@example.com's seeded password, and every later
# run of shared/sign-in.yaml — which is most of this directory — would fail on a
# login the seeders no longer describe. That makes the flow re-runnable, at the
# cost of leaving #3 and the success path to change-password.test.tsx and to one
# manual run.
#
# The client-side mismatch check is asserted first because it costs no request,
# which also proves the confirmation field is wired to something.
#
# Needs a reachable `ams` carrying KOL-7, like every flow built on
# shared/sign-in.yaml. Against a server without that endpoint the PUT 404s and
# the flow fails on the `La contraseña es incorrecta.` assertion.
appId: cl.kolvi.empleados
name: KMO-13 change password
tags:
  - auth
  - perfil
---
- runFlow: shared/sign-in.yaml

- tapOn: 'Abrir mi perfil'
- extendedWaitUntil:
    visible: 'Mi perfil'
    timeout: 10000
    label: 'The profile overlay is up'

# #5. The way in is a control on Mi perfil, not a deep link a colleague sent.
- assertVisible:
    text: 'Cambiar contraseña'
    label: 'The row is on the profile screen'

- tapOn:
    id: 'change-password-open'
    label: 'Cambiar contraseña on the profile card'

- extendedWaitUntil:
    visible: 'Esta es la misma contraseña que usas para entrar a Kolvi desde el computador. Al cambiarla, cambia en los dos lugares.'
    timeout: 10000
    label: 'The screen is up, and says this is the one credential rather than a phone-only password'

# #1. Three fields, each named in Spanish, character for character from src/i18n.
- assertVisible: 'Contraseña actual'
- assertVisible: 'Nueva contraseña'
- assertVisible: 'Repite la nueva contraseña'

- takeScreenshot: kmo-13-form

# The confirmation is checked on the phone: no request goes out, and the message
# names the mismatch rather than reporting a refusal the server never made.
- tapOn:
    id: 'change-password-current'
- inputText: 'admin'
- tapOn:
    id: 'change-password-new'
- inputText: 'Marcaje-2026!'
- tapOn:
    id: 'change-password-confirm'
- inputText: 'Marcaje-2027!'
- hideKeyboard

- tapOn:
    id: 'change-password-submit'
- extendedWaitUntil:
    visible: 'Las dos contraseñas no coinciden.'
    timeout: 10000
    label: 'Caught before the round trip'

# #2. Now a request that really goes out, with a current password that is wrong
# on purpose. The answer is the server's Spanish, under `Contraseña actual`.
- tapOn:
    id: 'change-password-confirm'
- eraseText
- inputText: 'Marcaje-2026!'
- tapOn:
    id: 'change-password-current'
- eraseText
- inputText: 'no-es-la-contrasena'
- hideKeyboard

- tapOn:
    id: 'change-password-submit'
- extendedWaitUntil:
    visible: 'La contraseña es incorrecta.'
    timeout: 15000
    label: "ams's own sentence, which src/i18n does not contain a copy of"

- takeScreenshot: kmo-13-wrong-current

# The form is still there to correct. A refusal is not an ending, and an employee
# who mistyped their password should not have to walk back in from Mi perfil.
- assertVisible:
    id: 'change-password-submit'
    label: 'Still fillable after the refusal'
