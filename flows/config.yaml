# Maestro workspace config.
#
# Only the top level is a flow. shared/ holds subflows that other flows pull in
# with runFlow; they are not runnable on their own and must not be collected as
# test cases.
flows:
  - '*.yaml'

# A flow tagged `requires-offline` only means anything with the radio off, which
# `bin/e2e` cannot arrange for one flow in the middle of a suite — and left in, it
# would fail every full run. Excluded from collection and run on its own:
#
#   bin/device net off && bin/e2e flows/kmo-8-login-offline.yaml && bin/device net on
#   bin/device finger enroll && bin/e2e kmo-10-biometric-unlock
#   bin/device finger clear  && bin/e2e kmo-10-biometric-unavailable
#
# The two biometric tags are mutually exclusive by definition — one needs an
# enrolled fingerprint on the AVD and the other needs there to be none — so
# neither can be part of a run that also contains the other.
#
# `requires-revoked-token` is the same shape of problem one step further out: the
# condition is on the *server*, and it has to be arranged between two runs rather
# than before one. The flow's own header carries the three commands.
# The three location conditions are the same shape again, and mutually exclusive
# with each other by definition — one needs the permission never asked, one needs
# it refused for good, and the third needs the OS location switch off:
#
#   bin/device perm reset        && bin/e2e kmo-16-permission
#   bin/device perm deny-forever && bin/e2e kmo-16-settings-route
#   bin/device perm grant && bin/device gps off && bin/e2e kmo-16-no-signal
#   bin/device gps on && bin/device perm grant
excludeTags:
  - requires-offline
  - requires-biometric
  - requires-no-biometric
  - requires-revoked-token
  - requires-gps-off
  - requires-location-prompt
  - requires-location-denied
