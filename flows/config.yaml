# Maestro workspace config.
#
# Only the top level is a flow. shared/ holds subflows that other flows pull in
# with runFlow; they are not runnable on their own and must not be collected as
# test cases.
flows:
  - '*.yaml'

# A flow tagged `requires-offline` only means anything with the radio off, which
# `bin/e2e` cannot arrange for one flow in the middle of a suite — and left in, it
# would fail every full run. Excluded from collection and run on its own:
#
#   bin/device net off && bin/e2e flows/kmo-8-login-offline.yaml && bin/device net on
#   bin/device finger enroll && bin/e2e kmo-10-biometric-unlock
#   bin/device finger clear  && bin/e2e kmo-10-biometric-unavailable
#
# The two biometric tags are mutually exclusive by definition — one needs an
# enrolled fingerprint on the AVD and the other needs there to be none — so
# neither can be part of a run that also contains the other.
#
# `requires-revoked-token` is the same shape of problem one step further out: the
# condition is on the *server*, and it has to be arranged between two runs rather
# than before one. The flow's own header carries the three commands.
# `requires-gps-off` is the same shape: the OS location switch belongs to the
# whole device, so a run that turned it off would take every other flow with it.
#
#   bin/device gps off && bin/e2e flows/kmo-16-no-signal.yaml && bin/device gps on
#
# The other KMO-16 flows need no tag. `clearState` resets the app's runtime
# permissions, so each of them starts from a phone that has given none and drives
# the rationale and the OS prompt itself — including the two refusals that make a
# permission permanent.
# The two geofence flows are the same shape once more, and mutually exclusive by
# definition: one asserts the device is at the premise and the other that it is
# not, and where the device stands is the emulator's state rather than something
# a flow can set. `Sucursal Centro`'s own coordinates, and a point ~2km west:
#
#   bin/device geo -33.4489 -70.6693 && bin/e2e flows/kmo-16-location.yaml
#   bin/device geo -33.4372 -70.6506 && bin/e2e flows/kmo-16-out-of-range.yaml
#
# `requires-unpunched-day` is not a device condition either: since `ams` KOL-34
# the punches are real and they stick, so the flow *spends* the day it needs. The
# register keeps one `in` and one `out` per day, and a second run finds a day it
# already closed. Clear today's marks for `employee@example.com` first:
#
#   bin/e2e flows/kmo-17-punch.yaml
#
# `kmo-17-punch-button.yaml` is in the suite and needs the same unpunched day,
# which is the other half of why the walk is kept out of it.
excludeTags:
  - requires-offline
  - requires-biometric
  - requires-no-biometric
  - requires-revoked-token
  - requires-gps-off
  - requires-geo-at-premise
  - requires-geo-off-premise
  - requires-unpunched-day
