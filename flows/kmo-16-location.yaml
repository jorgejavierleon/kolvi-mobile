# KMO-16 — the geolocation card above the shift card, once the permission is given.
#
# Covers #2's placement and copy, #5 (the state is named in words, not carried by
# the tint alone) and #6 (a premise with no geofence confirms and blocks nothing).
#
# **#6 is what this run actually proves today.** `ams` has no radius column and
# `GET /me/today` sends no geofence — that is `ams` KOL-33 — so every premise is
# a premise with no geofence, and the card confirms with the premise named and no
# distance on it. That is the criterion's own state, not a degraded one. The
# distance clause and the out-of-range state (#3) need KOL-33, and are covered by
# `geofence.test.ts` and `location-card.test.tsx` until then.
#
# The permission is granted from inside the flow rather than with `bin/device`
# beforehand: `clearState` in shared/launch.yaml resets the app's runtime
# permissions, so anything arranged before the run is gone by the time the app
# starts. That makes this flow self-contained — and it walks the path a new
# employee actually walks, through the rationale and the OS prompt.
#
#   bin/device gps on && bin/e2e flows/kmo-16-location.yaml
appId: cl.kolvi.empleados
name: KMO-16 location confirmed
tags:
  - marcaje
  - geo
---
- runFlow: shared/sign-in.yaml

- extendedWaitUntil:
    visible: 'Inicio'
    timeout: 30000
    label: 'On the tab shell'

# A freshly cleared app has no permission, so the card starts here.
- extendedWaitUntil:
    visible: 'Activar ubicación'
    timeout: 30000
    label: 'The card offers the way in'

- tapOn: 'Activar ubicación'

# #1, in passing. Its own flow is kmo-16-permission.yaml; here the sheet is only
# the road to the granted state.
- extendedWaitUntil:
    visible: 'Kolvi usa tu ubicación al marcar'
    timeout: 20000
    label: 'The rationale, before the OS prompt'

- tapOn: 'Continuar'

- extendedWaitUntil:
    visible:
      id: 'com.android.permissioncontroller:id/permission_allow_foreground_only_button'
    timeout: 20000
    label: "Android's own prompt"

# `While using the app`, and deliberately not `Only this time`: the app reads
# location while the Marcaje tab is in view and never in the background, which is
# exactly the grant this button gives (#10).
- tapOn:
    id: 'com.android.permissioncontroller:id/permission_allow_foreground_only_button'

# The card is drawn from the phone rather than from `/me/today`, so it is on
# screen before the shift is — but a fix takes a moment, and the assertion is
# about the state it settles into.
- extendedWaitUntil:
    visible: 'Ubicación confirmada'
    timeout: 30000
    label: '#2 — the confirmed state, on the card the phone drives'

- assertVisible:
    id: 'location-card'
    label: '#2 — and it is the card, not a stray string'

# #6. No geofence on the wire means the subtitle is the premise alone. The
# premise itself is server vocabulary and is not pinned here — the shift card's
# own flow already asserts it is rendered — so what is asserted is the half this
# criterion owns: nothing is claimed about a distance the app never measured.
# `a 12 m de la marca` is the clause that would appear if it were.
- assertNotVisible:
    text: '.*de la marca.*'
    label: '#6 — no distance is claimed for a premise with no geofence'

# The three states this one is not. Any of them would mean the app had decided
# something it has no grounds to decide.
- assertNotVisible:
    text: 'Fuera del rango permitido'
    label: '#6 — a premise with no radius is never out of range'
- assertNotVisible:
    text: 'Sin señal de GPS'
    label: '#2 — the phone answered'
- assertNotVisible:
    text: 'Sin permiso de ubicación'
    label: '#2 — with the permission granted'

# #5, the half a device can show: the state is named in words, so the tint is not
# carrying it alone. The design's own copy, character for character.
- assertVisible:
    text: 'Ubicación confirmada'
    label: '#5 — colour paired with text'

# The design's order — the location card above the shift card — which is what an
# employee reads on the way down to the punch button.
- extendedWaitUntil:
    visible: 'Turno de hoy'
    timeout: 30000
    label: 'The shift card loaded below it'

- takeScreenshot: kmo-16-confirmed
