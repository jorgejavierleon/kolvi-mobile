# KMO-1 — the app launches on a device and renders its first screen.
#
# The worked example for the harness: launch, assert the copy, capture. Every
# other flow is this shape with more steps in the middle.
#
# The assertions were on the KMO-1 placeholder screen, then on the navigation
# shell KMO-4 replaced it with, and now on the login screen KMO-8 put in front of
# it. The flow has followed the first screen each time and still verifies the one
# thing it has ever verified — that a cold launch reaches a rendered screen.
#
# Deliberately stops at the login screen rather than signing in: this is the
# smoke test, and it has to keep failing for the right reason on a machine with
# no backend running.
appId: cl.kolvi.empleados
name: KMO-1 app launch
tags:
  - smoke
---
- runFlow: shared/launch.yaml

# Bounded rather than immediate: the dev menu closing and the first frame of the
# app are two different moments, and a bare assertion between them fails on a
# loaded machine while proving nothing on a quiet one.
- extendedWaitUntil:
    visible: 'Ingresar'
    timeout: 60000
    label: 'A cold launch reaches a rendered screen'

- assertVisible: 'Correo electrónico'

- takeScreenshot: kmo-1-launched
