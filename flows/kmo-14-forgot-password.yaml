# KMO-14 — an employee who cannot get in asks for a reset link, and the app
# neither discloses who has an account nor lets them hammer the endpoint.
#
# Covers #1 (the link is on the login screen and the screen behind it collects an
# address and sends it), #3 (the confirmation is in Spanish and says where to
# look), the observable half of #2 (an address that certainly has no account gets
# the same conditional confirmation as one that does — the server answers 204
# either way, and the flow below proves the phone shows that answer rather than
# inventing one), and #5 (repeated requests are refused with a named wait rather
# than silently).
#
# **The address is deliberately one that does not exist**, for three reasons.
# `ams` keys this endpoint's limiter on email + IP (KOL-9), so throttling
# employee@example.com would poison that bucket for a minute; a fresh address per
# run makes the flow re-runnable inside that minute; and the broker mails nothing
# for an unknown address, so a run does not fill a real inbox with reset links.
#
# It is also the only tier that can show #2 at all from the phone: a screen that
# said "te enviamos un correo" would look identical in Jest and be a disclosure
# here, on an address nobody owns.
#
# Signed out throughout — this is the one surface an employee reaches without a
# token, so it starts from shared/launch.yaml rather than shared/sign-in.yaml.
#
# Needs a reachable `ams` carrying KOL-9. Against a server without that route the
# POST 404s and the flow fails on the confirmation, which is the correct answer:
# the app would have nothing to confirm.
appId: cl.kolvi.empleados
name: KMO-14 forgot password
tags:
  - auth
  - login
---
- runFlow: shared/launch.yaml

- extendedWaitUntil:
    visible: 'Ingresar'
    timeout: 60000
    label: 'The login screen is up'

# #1. The way out is on the screen an employee is stuck on, not somewhere they
# have to already know about.
- assertVisible:
    text: '¿Olvidaste tu contraseña?'
    label: '#1 — the link is on the login screen'

- tapOn:
    id: 'login-forgot-password'

- extendedWaitUntil:
    visible: 'Recuperar contraseña'
    timeout: 10000
    label: 'The recovery screen is up'

- assertVisible:
    text: 'Escribe el correo con el que entras a Kolvi y te enviaremos un enlace para crear una contraseña nueva.'
    label: 'It says what it will do before asking for anything'

- takeScreenshot: kmo-14-form

# Fresh per run: the limiter's bucket is keyed on this address and decays over a
# minute, so a fixed one would start a second run inside that minute already
# throttled and the successes below would never appear.
- evalScript: ${output.email = 'no-existe-kmo14-' + Date.now() + '@example.com'}

- tapOn:
    id: 'forgot-password-email'
- inputText: ${output.email}
- hideKeyboard

- tapOn:
    id: 'forgot-password-submit'

# #2 and #3. The address above belongs to nobody, and the screen still says the
# same thing it says for an employee who does exist — conditionally, because the
# server told it nothing either way.
- extendedWaitUntil:
    visible: 'Si ${output.email} tiene una cuenta en Kolvi.*'
    timeout: 15000
    label: '#2 — conditional, so an unknown address is not disclosed as unknown'

- assertVisible:
    text: 'Revisa tu correo'
    label: '#3 — where to look'

- assertVisible:
    text: '.*revisa la carpeta de spam o correo no deseado.*'
    label: '#3 — and where to look when it is not there'

- takeScreenshot: kmo-14-confirmation

# The form is gone rather than armed: on this endpoint a second submit can only
# earn a 429, since the limiter is what caps repetition.
- assertNotVisible:
    id: 'forgot-password-submit'
    label: 'The confirmation replaced the form'

# #5. `ams` allows 3 a minute for one address (KOL-9), so two more requests are
# accepted and the fourth is not. Each iteration walks back out to the login
# screen and in again, which is the only way back to the form — and is what an
# employee tapping repeatedly would actually do.
- repeat:
    times: 2
    commands:
      - tapOn:
          id: 'forgot-password-done'
      - extendedWaitUntil:
          visible: 'Ingresar'
          timeout: 15000
          label: 'Back on the login screen'
      - tapOn:
          id: 'login-forgot-password'
      - extendedWaitUntil:
          visible:
            id: 'forgot-password-email'
          timeout: 10000
          label: 'A fresh form'
      - tapOn:
          id: 'forgot-password-email'
      - inputText: ${output.email}
      - hideKeyboard
      - tapOn:
          id: 'forgot-password-submit'
      - extendedWaitUntil:
          visible: 'Si ${output.email} tiene una cuenta en Kolvi.*'
          timeout: 15000
          label: 'Still under the limit'

# The fourth request crosses it. From here the refusal is a 429 whose body is
# Laravel's English, and everything on screen has to be the catalogue's Spanish.
- tapOn:
    id: 'forgot-password-done'
- extendedWaitUntil:
    visible: 'Ingresar'
    timeout: 15000
    label: 'Back on the login screen'
- tapOn:
    id: 'login-forgot-password'
- extendedWaitUntil:
    visible:
      id: 'forgot-password-email'
    timeout: 10000
    label: 'A fresh form'
- tapOn:
    id: 'forgot-password-email'
- inputText: ${output.email}
- hideKeyboard
- tapOn:
    id: 'forgot-password-submit'

- extendedWaitUntil:
    visible: 'Demasiados intentos.*'
    timeout: 15000
    label: '#5 — refused out loud, in Spanish, rather than silently'

# First, and before anything slower: the interval the server named was read off
# `Retry-After` and put in the sentence. `Espera un momento` — the catalogue's
# wait-less fallback — would pass the assertion above and mean the header never
# arrived.
#
# The number is `\d+` rather than a range. Laravel's window opens on the *first*
# request of the four, so what is left of it by the fourth depends on how long
# Maestro took to walk back through the login screen three times — anywhere from
# the low tens down to single digits, and pinning a range makes the flow fail on
# a slow run rather than on a broken app.
- assertVisible:
    text: 'Demasiados intentos. Espera \d+ segundos.*'
    label: '#5 — the wait is named, so Retry-After was read'

# Not merely dimmed — unpressable, so the app cannot feed the limiter that just
# refused it.
- assertVisible:
    id: 'forgot-password-submit'
    enabled: false
    label: '#5 — the submit control is out of reach while the wait runs'

- takeScreenshot: kmo-14-throttled

# Res. 38 Art. 5. The server's untranslated sentence must not be what an employee
# reads.
- assertNotVisible:
    text: 'Too Many Attempts.'
    label: 'None of the server English reached the screen'

# The retry button belongs to a lost connection, where nothing was decided.
- assertNotVisible:
    id: 'forgot-password-retry'
    label: 'No retry is offered for a throttle'

# And no confirmation: nothing was queued, so telling the employee to go and wait
# for a mail would send them to an inbox that will stay empty.
- assertNotVisible:
    id: 'forgot-password-success'
    label: 'A refused request is not reported as sent'

# The countdown moves and then ends. Same pair as kmo-50-login-throttled.yaml,
# and for the same reason: a count derived during render freezes under React
# Compiler, and Jest cannot see it because it does not run the compiler.
#
# Single digits rather than a fixed range, so this proves movement from whatever
# the interval started at — the frozen version never reaches them.
- extendedWaitUntil:
    visible: 'Demasiados intentos. Espera [1-9] segundos.*'
    timeout: 60000
    label: 'The countdown is ticking down rather than frozen on its first value'

- extendedWaitUntil:
    visible:
      id: 'forgot-password-submit'
      enabled: true
    timeout: 90000
    label: 'The submit control comes back once the interval has passed'
