# KMO-3 — the shared primitives on a real device.
#
# Covers #7 (44px hit targets and accessibility labels — Maestro drives the app
# through the accessibility tree, so a primitive with no label is unreachable
# here and the flow fails) and #5 (the sheet presents and dismisses on backdrop
# press). #8 is the reason this flow exists at all: nothing in Jest can measure
# a layout, so the largest OS font scale has to be set on the device and the
# screen re-read afterwards.
#
# Set the scale with bin/device, not from inside the flow:
#
#   bin/device font reset && bin/e2e kmo-3     # the default 1.0
#   bin/device font max   && bin/e2e kmo-3     # Android's largest, 1.3
#
# The two runs assert exactly the same strings. At 1.3 a clipped primitive drops
# its text out of the hierarchy and the assertion fails; a primitive that merely
# wraps still reads. The screenshot is the record for what neither can express —
# checked by eye against the design.
#
# Rides on src/ui/gallery.tsx, which is scaffolding: KMO-30 deletes it and this
# flow with it.
appId: cl.kolvi.empleados
name: KMO-3 ui primitives
tags:
  - ui
---
- runFlow: shared/launch.yaml

# Wait for the app's own first screen before deep-linking. A kolvi:// link that
# arrives while the bundle is still loading is taken by the dev client, which
# answers it by showing its own launcher — the flow then fails somewhere far
# from the cause.
- extendedWaitUntil:
    visible: 'Inicio'
    timeout: 60000
    label: 'The app is mounted and can receive a deep link'

- openLink: kolvi://gallery
- extendedWaitUntil:
    visible: 'Primitivas'
    timeout: 20000
    label: 'The primitives gallery is on screen'

# Button — every variant and state, by its accessible name.
- assertVisible: 'Marcar entrada'
- assertVisible: 'Reintentar ubicación'
- assertVisible: 'Rechazar'
- assertVisible: 'Sincronizar'
- assertVisible: 'Guardando marca'
- assertVisible: 'Marcar salida'

# StatusBadge — #3: the status is words, not only a tint. All four tones are
# readable text, which is what makes this assertable at all.
- assertVisible: 'Completo'
- assertVisible: 'Atrasado'
- assertVisible: 'Ausente'
- assertVisible: 'Con permiso'

# TileRow — #6.
- assertVisible: 'Trabajado'
- assertVisible: 'Extra'
- assertVisible: 'Faltante'

# SegmentedControl — #4. Tapping the unselected segment moves the selection.
- assertVisible: 'Próximos'
- tapOn: 'Historial'
- assertVisible: 'Historial'

- takeScreenshot: kmo-3-primitives

# BottomSheet — #5. Opens over the screen, then the backdrop press dismisses it.
- tapOn: 'Listo'
- extendedWaitUntil:
    visible: '¡Marca registrada!'
    timeout: 5000
    label: 'The sheet has finished sliding up'
- assertVisible: 'Cerrar'

- takeScreenshot: kmo-3-bottom-sheet

- tapOn:
    id: 'bottom-sheet-backdrop'
    label: 'Press the backdrop above the sheet'
- assertNotVisible: '¡Marca registrada!'
