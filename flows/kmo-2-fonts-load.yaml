# KMO-2 — the bundled typefaces load and the splash screen lifts.
#
# Covers #3. The root layout holds expo-splash-screen up until useKolviFonts
# resolves, which introduces a way for a cold start to hang forever: a font file
# that does not decode leaves the app behind the splash with no way out. This
# flow is the guard on that — clearState + cold launch, and the first screen has
# to appear within a bound rather than "eventually".
#
# What it cannot prove is which typeface actually rendered; no assertion sees
# glyphs. The screenshot is the record for that, checked by eye against the
# design: Sora 700 for the heading, Plus Jakarta Sans for the copy under it.
#
# The assertions rode on the KMO-1 placeholder copy, then on the navigation shell
# KMO-4 replaced it with, and now on the login screen KMO-8 put in front of that.
# Signing in would only add a backend to a test about fonts.
appId: cl.kolvi.empleados
name: KMO-2 fonts load
tags:
  - smoke
---
- runFlow: shared/launch.yaml

- extendedWaitUntil:
    visible: 'Kolvi'
    timeout: 10000
    label: 'The splash lifts once the bundled fonts have loaded'

- assertVisible: 'Ingresa con las credenciales que usas en Kolvi.'

- takeScreenshot: kmo-2-fonts-loaded
